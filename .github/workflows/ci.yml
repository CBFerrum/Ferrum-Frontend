name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # A newer push supersedes a pull request's run; on main every run that starts finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  image:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: web
      - uses: actions/checkout@v4
        with:
          repository: CBFerrum/Ferrum
          path: ferrum
      - uses: docker/setup-buildx-action@v3
      # Ferrum's server image with this checkout as the source of the interfaces it carries (its
      # Dockerfile's `frontend` stage), deployed with its Compose stack and checked by its smoke test.
      - uses: docker/build-push-action@v6
        with:
          context: ferrum
          build-contexts: frontend=web
          load: true
          tags: ferrum:ci
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max
      - name: Deploy and check
        run: |
          python3 -m pip install --quiet httpx
          FERRUM_IMAGE=ferrum:ci ferrum/deploy/smoke.sh
