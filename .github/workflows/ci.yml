name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push supersedes a pull request's run; on main every run that starts finishes, so each
  # published image has been checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  image:
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ferrum-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The image is deployed with the server's Compose stack and checked (the server's
      # deploy/smoke.sh) before it is published.
      - uses: actions/checkout@v4
        with:
          repository: CBFerrum/Ferrum
          path: ferrum
      # The published server when this repository may read its package, else built from the same source.
      - name: The server
        run: |
          if docker pull -q ghcr.io/cbferrum/ferrum:latest; then
            docker tag ghcr.io/cbferrum/ferrum:latest ferrum:ci
          else
            docker buildx build --load -q -t ferrum:ci ferrum
          fi
      - name: Deploy and check the image
        run: |
          python3 -m pip install --quiet httpx
          FERRUM_IMAGE=ferrum:ci FERRUM_WEB_IMAGE=ferrum-frontend:ci ferrum/deploy/smoke.sh
      - if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/cbferrum/ferrum-frontend:${{ github.sha }}
            ghcr.io/cbferrum/ferrum-frontend:latest
          cache-from: type=gha
